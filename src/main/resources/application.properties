# Application Configuration
spring.application.name=expense-voucher-management
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/expense_voucher_db
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=3600000

# Security Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.example.expense_voucher_management.security=DEBUG

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Password Reset Email Configuration
app.password-reset.from=${MAIL_USERNAME}
